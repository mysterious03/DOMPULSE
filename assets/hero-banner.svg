<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="left-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.65)" />
    </linearGradient>
    <linearGradient id="right-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.75)" />
    </linearGradient>

    <!-- Glowing Accents -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="600" rx="16" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <rect width="1200" height="600" rx="16" fill="url(#grid)" />

  <!-- Top Hero Header -->
  <g transform="translate(60, 42)">
    <!-- Electric Pulse Icon Badge -->
    <rect x="0" y="2" width="38" height="38" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 21 8 L 11 22 L 19 22 L 17 32 L 27 18 L 19 18 Z" fill="#38bdf8" filter="url(#glow-cyan)" />

    <!-- Project Title -->
    <text x="50" y="24" class="font-sans" font-weight="900" font-size="28px" fill="#ffffff" letter-spacing="-0.5px">DOMPULSE</text>
    <text x="215" y="22" class="font-sans" font-weight="500" font-size="14px" fill="#94a3b8">|</text>
    <text x="230" y="23" class="font-sans" font-weight="600" font-size="14px" fill="#38bdf8">The Perception &amp; Change-Intelligence Layer for AI Browser Agents</text>
    
    <text x="50" y="44" class="font-sans" font-weight="400" font-size="13px" fill="#94a3b8">
      Stops AI agents from burning tokens on full-page screenshots. Detects meaningful DOM changes, filters 96% noise, and extracts screen bounding boxes in 15ms.
    </text>

    <!-- Top Status Pills -->
    <g transform="translate(860, 6)">
      <rect width="220" height="28" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#34d399" filter="url(#glow-green)" />
      <text x="28" y="18" class="font-sans" font-weight="700" font-size="11.5px" fill="#34d399">100% LOCAL  •  ZERO CLOUD APIS</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="108" x2="1140" y2="108" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- MAIN COMPARISON GRID -->
  <!-- LEFT: The Naive / Traditional Approach -->
  <g transform="translate(60, 128)">
    <rect width="520" height="364" rx="12" fill="url(#left-card)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5" />
    
    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect width="165" height="24" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
      <text x="10" y="16" class="font-sans" font-weight="700" font-size="11px" fill="#f87171">❌  WITHOUT DOMPULSE</text>
      
      <text x="0" y="52" class="font-sans" font-weight="700" font-size="17px" fill="#ffffff">Continuous Screenshot Polling</text>
      <text x="0" y="70" class="font-sans" font-weight="400" font-size="12px" fill="#94a3b8">AI agent repeatedly takes full 4K screenshots &amp; asks a Vision LLM:</text>
    </g>

    <!-- Workflow Diagram Inside Card -->
    <g transform="translate(24, 102)">
      <!-- Box 1: Action -->
      <rect width="472" height="42" rx="6" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="26" class="font-sans" font-weight="600" font-size="12px" fill="#cbd5e1">1. User / Agent clicks "Add to Cart"</text>
      <text x="320" y="26" class="font-mono" font-size="11px" fill="#f87171">104 raw mutations</text>

      <!-- Down Arrow -->
      <path d="M 236 46 L 236 56 M 232 52 L 236 57 L 240 52" stroke="#f87171" stroke-width="1.5" fill="none" />

      <!-- Box 2: Screenshot -->
      <rect y="60" width="472" height="42" rx="6" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="86" class="font-sans" font-weight="600" font-size="12px" fill="#cbd5e1">2. Captures full-page viewport screenshot</text>
      <text x="360" y="86" class="font-mono" font-size="11px" fill="#f87171">~5MB PNG</text>

      <!-- Down Arrow -->
      <path d="M 236 106 L 236 116 M 232 112 L 236 117 L 240 112" stroke="#f87171" stroke-width="1.5" fill="none" />

      <!-- Box 3: VLM Prompt -->
      <rect y="120" width="472" height="42" rx="6" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="14" y="146" class="font-sans" font-weight="600" font-size="12px" fill="#cbd5e1">3. Sends image to Cloud VLM (GPT-4o / Claude)</text>
      <text x="380" y="146" class="font-mono" font-size="11px" fill="#f87171">$$$ Cost</text>
    </g>

    <!-- Penalty Summary Box -->
    <g transform="translate(24, 282)">
      <rect width="472" height="64" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.3)" />
      <text x="16" y="24" class="font-sans" font-weight="700" font-size="12px" fill="#fca5a5">CONSEQUENCES:</text>
      <text x="16" y="46" class="font-sans" font-size="12px" fill="#fecaca">
        ⏱️ <tspan font-weight="700">3,000ms</tspan> latency per check  •  💰 <tspan font-weight="700">$0.04/action</tspan>  •  👁️ Blind to DOM state attributes
      </text>
    </g>
  </g>

  <!-- RIGHT: The DOMPulse Solution -->
  <g transform="translate(620, 128)">
    <rect width="520" height="364" rx="12" fill="url(#right-card)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    
    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect width="150" height="24" rx="6" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="10" y="16" class="font-sans" font-weight="700" font-size="11px" fill="#38bdf8">⚡  WITH DOMPULSE</text>
      
      <text x="0" y="52" class="font-sans" font-weight="700" font-size="17px" fill="#ffffff">Deterministic In-Browser Perception</text>
      <text x="0" y="70" class="font-sans" font-weight="400" font-size="12px" fill="#94a3b8">Observes DOM mutations, strips 96% noise, outputs exact screen bounding box:</text>
    </g>

    <!-- Output Code Preview Inside Card -->
    <g transform="translate(24, 102)">
      <rect width="472" height="162" rx="8" fill="#060a12" stroke="rgba(56, 189, 248, 0.25)" />
      
      <!-- Code Header -->
      <rect width="472" height="26" rx="8" fill="#0b1324" />
      <circle cx="14" cy="13" r="3.5" fill="#f87171" opacity="0.8" />
      <circle cx="26" cy="13" r="3.5" fill="#fbbf24" opacity="0.8" />
      <circle cx="38" cy="13" r="3.5" fill="#34d399" opacity="0.8" />
      <text x="54" y="17" class="font-mono" font-size="10.5px" fill="#64748b">window.dispatchEvent('dompulse:event') // Emitted in 15.4ms</text>

      <!-- Code Content -->
      <g transform="translate(14, 42)" class="font-mono" font-size="11px">
        <text y="0" fill="#94a3b8">{</text>
        <text y="17" x="14" fill="#38bdf8">"type"</text><text y="17" x="58" fill="#94a3b8">: </text><text y="17" x="70" fill="#34d399">"STATE_CHANGED"</text><text y="17" x="180" fill="#94a3b8">,</text>
        <text y="34" x="14" fill="#38bdf8">"element"</text><text y="34" x="74" fill="#94a3b8">: </text><text y="34" x="86" fill="#fbbf24">"button#checkout-btn"</text><text y="34" x="250" fill="#94a3b8">,</text>
        <text y="51" x="14" fill="#38bdf8">"attribute"</text><text y="51" x="86" fill="#94a3b8">: </text><text y="51" x="98" fill="#fca5a5">"disabled"</text><text y="51" x="175" fill="#94a3b8"> (false ➔ true),</text>
        <text y="68" x="14" fill="#38bdf8">"bbox"</text><text y="68" x="54" fill="#94a3b8">: { </text><text y="68" x="76" fill="#a7f3d0">"x": 720, "y": 540, "width": 150, "height": 42</text><text y="68" x="400" fill="#94a3b8"> },</text>
        <text y="85" x="14" fill="#38bdf8">"importance"</text><text y="85" x="96" fill="#94a3b8">: </text><text y="85" x="108" fill="#fb7185">5</text><text y="85" x="120" fill="#64748b"> // 1-5 Deterministic priority</text>
        <text y="102" fill="#94a3b8">}</text>
      </g>
    </g>

    <!-- DOMPulse Advantage Summary Box -->
    <g transform="translate(24, 282)">
      <rect width="472" height="64" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" />
      <text x="16" y="24" class="font-sans" font-weight="700" font-size="12px" fill="#6ee7b7">THE DOMPULSE ADVANTAGE:</text>
      <text x="16" y="46" class="font-sans" font-size="12px" fill="#a7f3d0">
        ⚡ <tspan font-weight="700">15.4ms</tspan> processing  •  💰 <tspan font-weight="700">$0.00</tspan> API cost  •  🎯 <tspan font-weight="700">Exact coordinates</tspan> for agent clicks
      </text>
    </g>
  </g>

  <!-- BOTTOM KPI METRICS STRIP -->
  <g transform="translate(60, 514)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="255" height="54" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="22" class="font-sans" font-weight="600" font-size="10px" fill="#94a3b8" letter-spacing="0.5px">NOISE ELIMINATED</text>
    <text x="18" y="44" class="font-mono" font-weight="800" font-size="20px" fill="#38bdf8">96.2%</text>
    <text x="96" y="43" class="font-sans" font-size="11px" fill="#64748b">(100 of 104 filtered)</text>

    <!-- Metric 2 -->
    <rect x="275" y="0" width="255" height="54" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="22" class="font-sans" font-weight="600" font-size="10px" fill="#94a3b8" letter-spacing="0.5px">PROCESSING LATENCY</text>
    <text x="18" y="44" class="font-mono" font-weight="800" font-size="20px" fill="#34d399">15.4 ms</text>
    <text x="110" y="43" class="font-sans" font-size="11px" fill="#64748b">Instant perception</text>

    <!-- Metric 3 -->
    <rect x="550" y="0" width="255" height="54" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="22" class="font-sans" font-weight="600" font-size="10px" fill="#94a3b8" letter-spacing="0.5px">CRITICAL RECALL</text>
    <text x="18" y="44" class="font-mono" font-weight="800" font-size="20px" fill="#fbbf24">100.0%</text>
    <text x="108" y="43" class="font-sans" font-size="11px" fill="#64748b">30 / 30 tests passed</text>

    <!-- Metric 4 -->
    <rect x="825" y="0" width="255" height="54" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="18" y="22" class="font-sans" font-weight="600" font-size="10px" fill="#94a3b8" letter-spacing="0.5px">ARCHITECTURE</text>
    <text x="18" y="44" class="font-sans" font-weight="800" font-size="16px" fill="#f43f5e">Manifest V3</text>
    <text x="124" y="43" class="font-sans" font-size="11px" fill="#64748b">Zero dependencies</text>
  </g>
</svg>
