<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="bad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.6)" />
    </linearGradient>
    <linearGradient id="good-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.12)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>

    <!-- Glow & Accents -->
    <linearGradient id="pulse-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 32px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 18px; }
    .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #cbd5e1; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11.5px; fill: #64748b; }
    .metric-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; font-size: 14px; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #38bdf8; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="640" rx="16" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Top Header Banner -->
  <g transform="translate(60, 48)">
    <!-- Pulse Icon Motif -->
    <circle cx="16" cy="16" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
    
    <text x="44" y="24" class="title">DOMPULSE</text>
    <text x="240" y="24" class="subtitle">|  The Perception Engine for Autonomous AI Browser Agents</text>
    <text x="44" y="46" class="step-desc" style="font-size: 13px; fill: #94a3b8;">
      Replaces continuous, expensive full-page screenshot polling with a deterministic 15ms local change-event layer.
    </text>
  </g>

  <!-- LEFT: Traditional Naive Vision Agent (Flawed, Expensive) -->
  <g transform="translate(60, 130)">
    <rect width="510" height="460" rx="14" fill="url(#bad-card)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="24" y="24" width="140" height="26" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
    <text x="34" y="41" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5px" fill="#f87171">⚠️ NAIVE VLM AGENT</text>
    
    <text x="24" y="78" class="card-title" fill="#fca5a5">Continuous Screenshot Polling</text>
    <text x="24" y="98" class="step-desc">Repeatedly captures the full webpage to ask AI what changed.</text>

    <!-- Pipeline Flow Steps -->
    <!-- Step 1 -->
    <g transform="translate(24, 120)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(239, 68, 68, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#f87171">1</text>
      <text x="50" y="25" class="step-text">Webpage Interaction Occurs</text>
      <text x="50" y="41" class="step-desc">Triggers 100+ DOM mutations (scripts, hover classes, framework re-renders)</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 184)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(239, 68, 68, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#f87171">2</text>
      <text x="50" y="25" class="step-text">Full-Page Viewport Screenshot Taken</text>
      <text x="50" y="41" class="step-desc">Captures massive 4K bitmap image (3–8 MB uncompressed payload)</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 248)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(239, 68, 68, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#f87171">3</text>
      <text x="50" y="25" class="step-text">Cloud VLM Inference Invocations</text>
      <text x="50" y="41" class="step-desc">Sends screenshot to GPT-4V / Gemini asking: "Did button state change?"</text>
    </g>

    <!-- Penalty Metrics Box -->
    <g transform="translate(24, 320)">
      <rect width="462" height="114" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#f87171">PERFORMANCE &amp; COST PENALTIES:</text>
      
      <text x="18" y="52" class="step-text" fill="#fca5a5">⏱️ Average Latency:</text>
      <text x="160" y="52" class="metric-val" fill="#ef4444">1,800ms – 4,000ms</text>
      
      <text x="18" y="74" class="step-text" fill="#fca5a5">💰 API Cost per Action:</text>
      <text x="160" y="74" class="metric-val" fill="#ef4444">$0.02 – $0.08 / step</text>

      <text x="18" y="96" class="step-text" fill="#fca5a5">❌ Perception Fidelity:</text>
      <text x="160" y="96" class="metric-val" fill="#ef4444">Blind to invisible state &amp; ARIA</text>
    </g>
  </g>

  <!-- RIGHT: The DOMPulse Perception Layer (100% Local, Fast, Deterministic) -->
  <g transform="translate(630, 130)">
    <rect width="510" height="460" rx="14" fill="url(#good-card)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="24" y="24" width="170" height="26" rx="6" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1" />
    <text x="34" y="41" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5px" fill="#34d399">⚡ THE DOMPULSE WAY</text>
    
    <text x="24" y="78" class="card-title" fill="#ffffff">Semantic Change-Intelligence Layer</text>
    <text x="24" y="98" class="step-desc">Observes DOM, filters 96.2% noise, and extracts exact screen bounding box.</text>

    <!-- Pipeline Flow Steps -->
    <!-- Step 1 -->
    <g transform="translate(24, 120)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(56, 189, 248, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#38bdf8">1</text>
      <text x="50" y="25" class="step-text" fill="#ffffff">80ms Debounce + 200ms MaxWait Buffer</text>
      <text x="50" y="41" class="step-desc">Collects multi-mutation framework bursts into a single coherent batch</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(24, 184)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(56, 189, 248, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#38bdf8">2</text>
      <text x="50" y="25" class="step-text" fill="#ffffff">96.2% Multi-Stage Noise Elimination</text>
      <text x="50" y="41" class="step-desc">Strips cosmetic classes, animation loops, and net-zero reversions (A→B→A)</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(24, 248)">
      <rect width="462" height="52" rx="8" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />
      <circle cx="26" cy="26" r="12" fill="rgba(56, 189, 248, 0.2)" />
      <text x="22" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#38bdf8">3</text>
      <text x="50" y="25" class="step-text" fill="#ffffff">Late Geometry Extraction &amp; JSON Stream</text>
      <text x="50" y="41" class="step-desc">Calculates bbox [x, y, w, h] only on survivors; emits in-page dompulse:event</text>
    </g>

    <!-- Winning Metrics Box -->
    <g transform="translate(24, 320)">
      <rect width="462" height="114" rx="8" fill="rgba(52, 211, 153, 0.08)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="12px" fill="#34d399">DOMPULSE PRODUCTION ADVANTAGES:</text>
      
      <text x="18" y="52" class="step-text" fill="#a7f3d0">⚡ Processing Latency:</text>
      <text x="160" y="52" class="metric-val" fill="#34d399">15.4ms (Instantaneous)</text>
      
      <text x="18" y="74" class="step-text" fill="#a7f3d0">💰 Cloud API Invocations:</text>
      <text x="160" y="74" class="metric-val" fill="#34d399">$0.00 (Zero VLM needed for check)</text>

      <text x="18" y="96" class="step-text" fill="#a7f3d0">🎯 Important Event Recall:</text>
      <text x="160" y="96" class="metric-val" fill="#34d399">100.0% (30 / 30 Automated Tests)</text>
    </g>
  </g>
</svg>
